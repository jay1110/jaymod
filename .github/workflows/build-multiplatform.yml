name: Multi-Platform Build

on:
  push:
    branches:
      - master
      - 'feature/**'
      - 'fix/**'
      - 'copilot/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux64:
    name: Build linux64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 zip m4

      - name: Make info.py executable
        run: chmod +x project/info.py

      - name: Build linux64 release
        run: PLATFORM=linux64 make -j$(nproc) release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-linux64
          path: |
            build.linux64-release/game/qagame.mp.x86_64.so
            build.linux64-release/cgame/cgame.mp.x86_64.so
            build.linux64-release/ui/ui.mp.x86_64.so

  build-linux32:
    name: Build linux32
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 zip m4 gcc-multilib g++-multilib

      - name: Make info.py executable
        run: chmod +x project/info.py

      - name: Build linux32 release
        run: PLATFORM=linux make -j$(nproc) release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-linux32
          path: |
            build.linux-release/game/qagame.mp.i386.so
            build.linux-release/cgame/cgame.mp.i386.so
            build.linux-release/ui/ui.mp.i386.so

  build-windows:
    name: Build Windows (mingw32 + mingw64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 zip m4 mingw-w64

      - name: Make info.py executable
        run: chmod +x project/info.py

      - name: Build mingw32 release
        run: PLATFORM=mingw make -j$(nproc) release

      - name: Build mingw64 release
        run: PLATFORM=mingw64 make -j$(nproc) release

      - name: Upload mingw32 artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-win32
          path: |
            build.mingw-release/game/qagame_mp_x86.dll
            build.mingw-release/cgame/cgame_mp_x86.dll
            build.mingw-release/ui/ui_mp_x86.dll

      - name: Upload mingw64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-win64
          path: |
            build.mingw64-release/game/qagame_mp_x64.dll
            build.mingw64-release/cgame/cgame_mp_x64.dll
            build.mingw64-release/ui/ui_mp_x64.dll

  build-linux-aarch64:
    name: Build linux-aarch64 (cross-compile)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 zip m4 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Make info.py executable
        run: chmod +x project/info.py

      - name: Build linux-aarch64 release
        run: PLATFORM=linux-aarch64 make -j$(nproc) release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-linux-aarch64
          path: |
            build.linux-aarch64-release/game/qagame.mp.aarch64.so
            build.linux-aarch64-release/cgame/cgame.mp.aarch64.so
            build.linux-aarch64-release/ui/ui.mp.aarch64.so

  build-macos:
    name: Build macOS Universal (x86_64 + arm64)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install m4

      - name: Make info.py executable
        run: chmod +x project/info.py

      - name: Build osx64 release
        run: PLATFORM=osx64 make -j$(sysctl -n hw.logicalcpu) release

      - name: Build osx-arm64 release
        run: PLATFORM=osx-arm64 make -j$(sysctl -n hw.logicalcpu) release

      - name: Create universal binaries
        run: |
          set -eu

          # osx64 and osx-arm64 use separate build trees and each link a plain
          # Mach-O bundle named <module>_mac, so the two slices can be merged
          # directly with lipo without any intermediate unwrapping.
          mkdir -p artifacts/macos-universal

          for module in game/qagame cgame/cgame ui/ui; do
            name="$(basename "$module")_mac"
            x86_file="build.osx64-release/$(dirname "$module")/$name"
            arm_file="build.osx-arm64-release/$(dirname "$module")/$name"

            if [ ! -f "$x86_file" ]; then
              echo "error: missing x86_64 binary $x86_file"
              exit 1
            fi
            if [ ! -f "$arm_file" ]; then
              echo "error: missing arm64 binary $arm_file"
              exit 1
            fi

            echo "Creating universal binary for $name"
            lipo -create "$x86_file" "$arm_file" -output "artifacts/macos-universal/$name"
            lipo -info "artifacts/macos-universal/$name"
          done

          ls -la artifacts/macos-universal/

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-macos-universal
          path: artifacts/macos-universal/*_mac
          if-no-files-found: error

  build-android:
    name: Build Android ${{ matrix.abi }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android-arm64
            abi: arm64-v8a
            suffix: arm64-v8a
          - platform: android-armv7a
            abi: armeabi-v7a
            suffix: armeabi-v7a
          - platform: android-x86
            abi: x86
            suffix: i386
          - platform: android-x86_64
            abi: x86_64
            suffix: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 zip m4

      - name: Make info.py executable
        run: chmod +x project/info.py

      - name: Build ${{ matrix.platform }} release
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: PLATFORM=${{ matrix.platform }} make -j$(nproc) release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-android-${{ matrix.abi }}
          path: |
            build.${{ matrix.platform }}-release/game/qagame.mp.android.${{ matrix.suffix }}.so
            build.${{ matrix.platform }}-release/cgame/cgame.mp.android.${{ matrix.suffix }}.so
            build.${{ matrix.platform }}-release/ui/ui.mp.android.${{ matrix.suffix }}.so
          if-no-files-found: error

  build-wasm:
    name: Build WebAssembly (Emscripten)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 zip m4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Make info.py executable
        run: chmod +x project/info.py

      - name: Build wasm release
        run: |
          em++ --version
          PLATFORM=wasm make -j$(nproc) release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-wasm
          path: |
            build.wasm-release/game/qagame.mp.wasm32.so
            build.wasm-release/cgame/cgame.mp.wasm32.so
            build.wasm-release/ui/ui.mp.wasm32.so
          if-no-files-found: error

  create-release-package:
    name: Create Release Package
    runs-on: ubuntu-latest
    needs:
      - build-linux64
      - build-linux32
      - build-windows
      - build-linux-aarch64
      - build-macos
      - build-android
      - build-wasm

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          path: artifacts/

      - name: Create unified release package
        run: |
          set -eu

          # Copy every file of a downloaded artifact into a flat platform
          # directory of the unified package. The artifacts keep the
          # module sub-directories (game/, cgame/, ui/) created by
          # upload-artifact, so flatten them here.
          copy_artifact() {
            artifact="$1"
            dest="release/jaymod-multiplatform/$2"
            if [ ! -d "artifacts/$artifact" ]; then
              echo "missing: $artifact"
              return 1
            fi
            mkdir -p "$dest"
            find "artifacts/$artifact" -type f -exec cp {} "$dest/" \;
            echo "ok: $artifact -> $2 ($(find "$dest" -type f | wc -l) file(s))"
          }

          copy_artifact jaymod-linux64                linux-x86_64
          copy_artifact jaymod-linux32                linux-i386
          copy_artifact jaymod-linux-aarch64          linux-aarch64
          copy_artifact jaymod-win32                  windows-i386
          copy_artifact jaymod-win64                  windows-x86_64
          copy_artifact jaymod-macos-universal        macos-universal
          copy_artifact jaymod-android-arm64-v8a      android/arm64-v8a
          copy_artifact jaymod-android-armeabi-v7a    android/armeabi-v7a
          copy_artifact jaymod-android-x86            android/x86
          copy_artifact jaymod-android-x86_64         android/x86_64
          copy_artifact jaymod-wasm                   wasm32

          echo '=== release package structure ==='
          find release/jaymod-multiplatform -type f | sort

          cd release
          zip -r "jaymod-multiplatform-${GITHUB_SHA}.zip" jaymod-multiplatform/

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-multiplatform
          path: release/jaymod-multiplatform-*.zip
          if-no-files-found: error
