name: Release Build

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release after building'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
jobs:
  build-linux64:
    name: Build linux64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 zip m4
      - name: Make info.py executable
        run: chmod +x project/info.py
      - name: Build linux64 release
        run: PLATFORM=linux64 make -j$(nproc) release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-linux64
          path: |
            build.linux64-release/game/qagame.mp.x86_64.so
            build.linux64-release/cgame/cgame.mp.x86_64.so
            build.linux64-release/ui/ui.mp.x86_64.so

  build-linux32:
    name: Build linux32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 zip m4 gcc-multilib g++-multilib
      - name: Make info.py executable
        run: chmod +x project/info.py
      - name: Build linux32 release
        run: PLATFORM=linux make -j$(nproc) release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-linux32
          path: |
            build.linux-release/game/qagame.mp.i386.so
            build.linux-release/cgame/cgame.mp.i386.so
            build.linux-release/ui/ui.mp.i386.so

  build-windows:
    name: Build Windows (mingw32 + mingw64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 zip m4 mingw-w64
      - name: Make info.py executable
        run: chmod +x project/info.py
      - name: Build mingw32 release
        run: PLATFORM=mingw make -j$(nproc) release
      - name: Build mingw64 release
        run: PLATFORM=mingw64 make -j$(nproc) release
      - name: Upload mingw32 artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-win32
          path: |
            build.mingw-release/game/qagame_mp_x86.dll
            build.mingw-release/cgame/cgame_mp_x86.dll
            build.mingw-release/ui/ui_mp_x86.dll
      - name: Upload mingw64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-win64
          path: |
            build.mingw64-release/game/qagame_mp_x64.dll
            build.mingw64-release/cgame/cgame_mp_x64.dll
            build.mingw64-release/ui/ui_mp_x64.dll

  build-linux-aarch64:
    name: Build linux-aarch64 (cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 zip m4 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Make info.py executable
        run: chmod +x project/info.py
      - name: Build linux-aarch64 release
        run: PLATFORM=linux-aarch64 make -j$(nproc) release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-linux-aarch64
          path: |
            build.linux-aarch64-release/game/qagame.mp.aarch64.so
            build.linux-aarch64-release/cgame/cgame.mp.aarch64.so
            build.linux-aarch64-release/ui/ui.mp.aarch64.so

  build-osx64:
    name: Build macOS x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install m4
      - name: Make info.py executable
        run: chmod +x project/info.py
      - name: Build osx64 release
        run: PLATFORM=osx64 make -j$(sysctl -n hw.logicalcpu) release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-osx64
          path: |
            build.osx64-release/game/qagame_mac
            build.osx64-release/cgame/cgame_mac
            build.osx64-release/ui/ui_mac

  build-osx-arm64:
    name: Build macOS ARM64 (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install m4
      - name: Make info.py executable
        run: chmod +x project/info.py
      - name: Build osx-arm64 release
        run: PLATFORM=osx-arm64 make -j$(sysctl -n hw.logicalcpu) release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-osx-arm64
          path: |
            build.osx-arm64-release/game/qagame_mac
            build.osx-arm64-release/cgame/cgame_mac
            build.osx-arm64-release/ui/ui_mac

  build-android:
    name: Build Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android-arm64
            abi: arm64-v8a
            suffix: arm64-v8a
          - platform: android-armv7a
            abi: armeabi-v7a
            suffix: armeabi-v7a
          - platform: android-x86
            abi: x86
            suffix: i386
          - platform: android-x86_64
            abi: x86_64
            suffix: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 zip m4
      - name: Make info.py executable
        run: chmod +x project/info.py
      - name: Build ${{ matrix.platform }} release
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: PLATFORM=${{ matrix.platform }} make -j$(nproc) release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-android-${{ matrix.abi }}
          path: |
            build.${{ matrix.platform }}-release/game/qagame.mp.android.${{ matrix.suffix }}.so
            build.${{ matrix.platform }}-release/cgame/cgame.mp.android.${{ matrix.suffix }}.so
            build.${{ matrix.platform }}-release/ui/ui.mp.android.${{ matrix.suffix }}.so
          if-no-files-found: error

  build-wasm:
    name: Build WebAssembly (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 zip m4
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Make info.py executable
        run: chmod +x project/info.py
      - name: Build wasm release
        run: |
          em++ --version
          PLATFORM=wasm make -j$(nproc) release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-wasm
          path: |
            build.wasm-release/game/qagame.mp.wasm32.so
            build.wasm-release/cgame/cgame.mp.wasm32.so
            build.wasm-release/ui/ui.mp.wasm32.so
          if-no-files-found: error

  build-pak:
    name: Build pak data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 zip m4
      - name: Make info.py executable
        run: chmod +x project/info.py
      - name: Build pak data (linux64 for project metadata)
        run: PLATFORM=linux64 make -j$(nproc) release
      - name: Upload pak artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-pak
          path: build.linux64-release/jaymod-2.2.0/jaymod-*.pk3

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux64, build-linux32, build-linux-aarch64, build-windows, build-osx64, build-osx-arm64, build-android, build-wasm, build-pak]
    if: ${{ inputs.create_release }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          path: release-artifacts/

      - name: Get version
        id: version
        run: |
          chmod +x project/info.py
          VERSION=$(PLATFORM=linux64 python3 project/info.py -mk project/info.db | grep 'PROJECT.version' | cut -d= -f2 | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release archives
        run: |
          mkdir -p release-dist
          cd release-artifacts
          for d in */; do
            name="${d%/}"
            zip -r "../release-dist/jaymod-${name}.zip" "$d"
          done

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const version = '${{ steps.version.outputs.version }}';
            const tag = `v${version}-${Date.now()}`;

            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Jaymod ${version}`,
              prerelease: true,
              generate_release_notes: true,
            });

            const distDir = 'release-dist';
            const files = fs.readdirSync(distDir);
            for (const file of files) {
              const filePath = path.join(distDir, file);
              const data = fs.readFileSync(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: file,
                data: data,
              });
            }
