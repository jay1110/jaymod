name: Quick Mixed Build

on:
  push:
    branches:
      - master
      - 'feature/**'
      - 'fix/**'
      - 'copilot/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-linux64-qagame:
    name: Build linux64 qagame
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 zip m4

      - name: Make info.py executable
        run: chmod +x project/info.py

      - name: Build linux64 qagame release
        run: PLATFORM=linux64 make -j$(nproc) release MODULES="src/lua src/sqlite3 src/base src/game"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-linux64-qagame
          path: build.linux64-release/game/qagame.mp.x86_64.so

  build-windows-cgame-ui:
    name: Build Windows (mingw32 + mingw64) cgame + ui
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 zip m4 mingw-w64

      - name: Make info.py executable
        run: chmod +x project/info.py

      - name: Build mingw32 cgame + ui release
        run: PLATFORM=mingw make -j$(nproc) release MODULES="src/lua src/sqlite3 src/base src/cgame src/ui"

      - name: Build mingw64 cgame + ui release
        run: PLATFORM=mingw64 make -j$(nproc) release MODULES="src/lua src/sqlite3 src/base src/cgame src/ui"

      - name: Upload mingw32 artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-win32-cgame-ui
          path: |
            build.mingw-release/cgame/cgame_mp_x86.dll
            build.mingw-release/ui/ui_mp_x86.dll

      - name: Upload mingw64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaymod-win64-cgame-ui
          path: |
            build.mingw64-release/cgame/cgame_mp_x64.dll
            build.mingw64-release/ui/ui_mp_x64.dll

  build-summary:
    name: Summary
    needs: [build-linux64-qagame, build-windows-cgame-ui]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Write step summary
        run: |
          echo "## Quick Mixed Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| linux64 qagame | ${{ needs.build-linux64-qagame.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows cgame+ui | ${{ needs.build-windows-cgame-ui.result }} |" >> $GITHUB_STEP_SUMMARY
